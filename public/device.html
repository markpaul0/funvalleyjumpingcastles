<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fun Valley | Device Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6f0;color:#232042;font-family:system-ui,-apple-system,sans-serif}.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-bottom:1px solid #d9d5e5;padding:14px 20px}.bar strong{font-size:17px}.options{display:flex;gap:7px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #d3cbe7;background:#fff;color:#232042;padding:9px 16px;border-radius:99px;font-weight:750}button.active{background:#6846df;color:#fff;border-color:#6846df}.workspace{display:grid;place-items:start center;padding:35px 16px 65px;min-height:calc(100vh - 80px);overflow:auto}.device{background:#27243c;padding:13px;border-radius:29px;box-shadow:0 22px 50px #231e4230;width:min(100%,1280px);height:760px;transition:width .3s,height .3s,border-radius .3s;position:relative}.device:before{content:"";display:none;position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#27243c;width:100px;height:21px;border-radius:0 0 14px 14px;z-index:3}.device.mobile{width:390px;max-width:100%;height:844px;border-radius:40px;padding:12px}.device.mobile:before{display:block}.device.tablet{width:820px;max-width:100%;height:1070px;border-radius:28px}.device.desktop{width:min(100%,1280px);height:760px;border-radius:18px}.device iframe{width:100%;height:100%;border:0;background:#fff;border-radius:inherit;display:block}.hint{font-size:12px;color:#68647a}.external{color:#6846df;font-weight:750;text-decoration:none}@media(max-width:650px){.workspace{padding:22px 8px}.bar{padding:12px}.device{max-width:calc(100vw - 16px)}}
</style></head><body><header class="bar"><div><strong>Fun Valley · Device Preview</strong><div class="hint">Presentation view only — not linked on the public site.</div></div><div class="options" role="group" aria-label="Device size"><button type="button" data-width="desktop" class="active" aria-pressed="true">🖥 Desktop</button><button type="button" data-width="tablet" aria-pressed="false">▣ Tablet</button><button type="button" data-width="mobile" aria-pressed="false">▯ Mobile</button></div><a class="external" href="/" target="_blank" rel="noopener">Open website ↗</a></header><main class="workspace"><div class="device desktop" id="device"><iframe title="Fun Valley website live preview" src="/"></iframe></div></main><script>const device=document.getElementById('device');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{device.className='device '+b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>{let yes=x===b;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',String(yes))})}))</script></body></html>
